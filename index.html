<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BR.ONLINE - Advanced Call Tracker</title>
    <!-- Tailwind CSS for sleek layouts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons for iconography -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- SheetJS to read your 37,000+ row Excel files directly in the browser -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 min-h-screen">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <i data-lucide="phone-call" class="w-8 h-8 text-indigo-200"></i>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight">BR.ONLINE</h1>
                    <p class="text-xs text-indigo-200">Live Excel Lead Management Engine</p>
                </div>
            </div>
            
            <!-- File Upload Input Custom Styled -->
            <div class="flex items-center gap-2 bg-indigo-800 p-2 rounded-lg border border-indigo-500/30">
                <label class="text-xs font-semibold text-indigo-200 mr-2">Load Excel:</label>
                <input type="file" id="excelFileInput" accept=".xlsx, .xls" class="block w-full text-xs text-gray-300 file:mr-4 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer" />
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
        
        <!-- Controls Panel -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                
                <!-- Dynamic Village Dropdown Selector -->
                <div class="flex flex-col gap-1.5">
                    <label for="villageFilter" class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Select Village Division</label>
                    <div class="relative">
                        <select id="villageFilter" class="w-full bg-gray-50 border border-gray-300 rounded-lg pl-3 pr-10 py-2.5 text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 appearance-none cursor-pointer">
                            <option value="All">🌍 All Villages (Upload list first)</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-500">
                            <i data-lucide="chevron-down" class="w-4 h-4"></i>
                        </div>
                    </div>
                </div>

                <!-- Multi-Criteria Dynamic Search Bar -->
                <div class="flex flex-col gap-1.5 md:col-span-2">
                    <label for="searchInput" class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Search Customer</label>
                    <div class="relative">
                        <input type="text" id="searchInput" placeholder="Search instantly by Farmer Name, Phone number, or Registration No..." 
                               class="w-full bg-gray-50 border border-gray-300 rounded-lg pl-10 pr-4 py-2.5 text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                            <i data-lucide="search" class="w-5 h-5"></i>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Section Tabs (Pending vs Called Dashboard Routes) -->
        <div class="flex border-b border-gray-200 mb-6 bg-white rounded-t-xl overflow-hidden shadow-sm">
            <button id="tabPending" onclick="switchTab('pending')" class="flex-1 py-4 px-6 text-center font-semibold text-sm border-b-2 transition-all flex justify-center items-center gap-2 border-indigo-600 text-indigo-600 bg-indigo-50/30">
                <i data-lucide="list-todo" class="w-4 h-4"></i>
                Pending Calls 
                <span id="badgePending" class="bg-indigo-600 text-white text-xs px-2 py-0.5 rounded-full ml-1">0</span>
            </button>
            <button id="tabCalled" onclick="switchTab('called')" class="flex-1 py-4 px-6 text-center font-semibold text-sm border-b-2 transition-all flex justify-center items-center gap-2 border-transparent text-gray-500 hover:text-gray-700 hover:bg-gray-50">
                <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                Called Section
                <span id="badgeCalled" class="bg-gray-400 text-white text-xs px-2 py-0.5 rounded-full ml-1">0</span>
            </button>
        </div>

        <!-- Master Data Container -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-200 text-gray-600 text-xs font-bold uppercase tracking-wider">
                            <th class="px-6 py-4">Farmer Name</th>
                            <th class="px-6 py-4">Registration No</th>
                            <th class="px-6 py-4">Phone Number</th>
                            <th class="px-6 py-4">Village</th>
                            <th class="px-6 py-4 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-100 text-sm">
                        <!-- Rows dynamically inject here -->
                    </tbody>
                </table>
            </div>
            
            <!-- Empty/Initial Placeholder State -->
            <div id="emptyState" class="flex flex-col items-center justify-center py-20 px-4 text-center">
                <div class="bg-indigo-50 p-4 rounded-full text-indigo-500 mb-4 animate-bounce">
                    <i data-lucide="file-spreadsheet" class="w-10 h-10"></i>
                </div>
                <h3 class="text-lg font-medium text-gray-700 mb-1">No Leads Loaded Yet</h3>
                <p class="text-gray-500 text-sm max-w-sm">Please pick and upload your <span class="font-semibold text-indigo-600">bhairaguri pm kisan list.xlsx</span> file via the top bar to initialize your database lists.</p>
            </div>
        </div>

    </main>

    <script>
        // System Global Array variables to store real parsed records
        let customers = [];
        let currentTab = 'pending';

        // Interface DOM Caches
        const fileInput = document.getElementById('excelFileInput');
        const tableBody = document.getElementById('tableBody');
        const emptyState = document.getElementById('emptyState');
        const searchInput = document.getElementById('searchInput');
        const villageFilter = document.getElementById('villageFilter');
        const badgePending = document.getElementById('badgePending');
        const badgeCalled = document.getElementById('badgeCalled');

        document.addEventListener("DOMContentLoaded", () => lucide.createIcons());

        // Event listener monitoring Excel file uploads
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                
                // Read from first available sheet automatically
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                // Convert spreadsheet row data matrices directly to JSON arrays
                const rawJson = XLSX.utils.sheet_to_json(worksheet);
                
                // Map columns safely handling clean formatting defaults
                customers = rawJson.map((row, index) => ({
                    id: index + 1,
                    Farmer_Name: row.Farmer_Name ? String(row.Farmer_Name).toUpperCase().trim() : 'UNKNOWN FARMER',
                    Reg_No: row.Reg_No ? String(row.Reg_No).trim() : 'NO REG VALUE',
                    MobileNo: row.MobileNo ? String(row.MobileNo).trim() : '',
                    RevenueVillageName: row.RevenueVillageName ? String(row.RevenueVillageName).trim() : 'Blank Village',
                    status: 'pending' // Defaults everyone to uncontacted pending state tracking
                }));

                // Extract all unique villages to automatically build drop-down filter values
                const uniqueVillages = [...new Set(customers.map(c => c.RevenueVillageName))].sort();
                
                // Populate Dropdown values
                let dropdownHtml = `<option value="All">🌍 All Villages (${customers.length} total leads)</option>`;
                uniqueVillages.forEach(village => {
                    dropdownHtml += `<option value="${village}">${village}</option>`;
                });
                villageFilter.innerHTML = dropdownHtml;

                // Refresh interface to populate lists immediately
                renderDashboard();
            };
            reader.readAsArrayBuffer(file);
        });

        // Register configuration changes tracking live input updates
        searchInput.addEventListener('input', renderDashboard);
        villageFilter.addEventListener('change', renderDashboard);

        function switchTab(tabType) {
            currentTab = tabType;
            const tabPending = document.getElementById('tabPending');
            const tabCalled = document.getElementById('tabCalled');
            
            if (tabType === 'pending') {
                tabPending.className = "flex-1 py-4 px-6 text-center font-semibold text-sm border-b-2 transition-all flex justify-center items-center gap-2 border-indigo-600 text-indigo-600 bg-indigo-50/30";
                tabCalled.className = "flex-1 py-4 px-6 text-center font-semibold text-sm border-b-2 transition-all flex justify-center items-center gap-2 border-transparent text-gray-500 hover:text-gray-700 hover:bg-gray-50";
            } else {
                tabCalled.className = "flex-1 py-4 px-6 text-center font-semibold text-sm border-b-2 transition-all flex justify-center items-center gap-2 border-indigo-600 text-indigo-600 bg-indigo-50/30";
                tabPending.className = "flex-1 py-4 px-6 text-center font-semibold text-sm border-b-2 transition-all flex justify-center items-center gap-2 border-transparent text-gray-500 hover:text-gray-700 hover:bg-gray-50";
            }
            renderDashboard();
        }

        function renderDashboard() {
            if (customers.length === 0) return;

            const query = searchInput.value.toLowerCase().trim();
            const selectedVillage = villageFilter.value;

            // Compute dynamic global badge tallies
            const totalPending = customers.filter(c => c.status === 'pending').length;
            const totalCalled = customers.filter(c => c.status === 'called').length;
            badgePending.innerText = totalPending;
            badgeCalled.innerText = totalCalled;

            // Apply filtering metrics criteria 
            const displayingRecords = customers.filter(customer => {
                if (customer.status !== currentTab) return false;

                const matchVillage = (selectedVillage === 'All' || customer.RevenueVillageName === selectedVillage);
                const matchSearch = customer.Farmer_Name.toLowerCase().includes(query) || 
                                    customer.Reg_No.toLowerCase().includes(query) || 
                                    customer.MobileNo.includes(query);

                return matchVillage && matchSearch;
            });

            // Handle display logic depending on active dataset volume limits
            if (displayingRecords.length === 0) {
                tableBody.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            // Virtualized slice rendering approach prevents lag rendering thousands of rows at once
            const elementsToRender = displayingRecords.slice(0, 100); 

            tableBody.innerHTML = elementsToRender.map(customer => `
                <tr class="hover:bg-gray-50 transition-colors">
                    <td class="px-6 py-4 font-semibold text-gray-900">${customer.Farmer_Name}</td>
                    <td class="px-6 py-4"><span class="bg-gray-100 font-mono text-xs text-gray-600 border border-gray-200 px-2 py-1 rounded">${customer.Reg_No}</span></td>
                    <td class="px-6 py-4 text-gray-600 font-medium">${customer.MobileNo ? customer.MobileNo : '<span class="text-gray-300 italic text-xs">No Phone</span>'}</td>
                    <td class="px-6 py-4"><span class="inline-flex items-center gap-1 text-xs font-semibold px-2 py-0.5 rounded bg-blue-50 text-blue-700 border border-blue-100">${customer.RevenueVillageName}</span></td>
                    <td class="px-6 py-4 text-right">
                        ${customer.status === 'pending' ? `
                            <!-- Using an anchor link with href="tel:" triggers the calling device app instantly -->
                            <a href="tel:${customer.MobileNo || ''}" onclick="executeImmediateRedirect(${customer.id})" class="inline-flex items-center gap-1.5 bg-green-600 hover:bg-green-700 text-white text-xs font-bold px-4 py-2 rounded-lg transition-all active:scale-95 cursor-pointer">
                                <i data-lucide="phone" class="w-3.5 h-3.5"></i> Call
                            </a>
                        ` : `
                            <span class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-bold bg-green-100 text-green-700 border border-green-200"><i data-lucide="check" class="w-3.5 h-3.5"></i> Called</span>
                        `}
                    </td>
                </tr>
            `).join('');

            lucide.createIcons();
        }

        // Action workflow to change status and INSTANTLY redirect agent layout views
        function executeImmediateRedirect(id) {
            const customerIndex = customers.findIndex(c => c.id === id);
            if (customerIndex !== -1) {
                // Change tracking state parameter settings
                customers[customerIndex].status = 'called';
                
                // Redirect user layout views straight over to the 'called' section tabs without delay
                switchTab('called');
            }
        }
    </script>
</body>
</html>
